services:
  app:
    build: .
    container_name: grants-template-app
    ports:
      - "8080:80"
    restart: always
    volumes:
      - ./:/var/www/html
    depends_on:
      - db
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: grants-template
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    expose:
      - "8080"
 
  db:
    image: postgres:16.10
    container_name: grants-template-db
    restart: always
    environment:
      POSTGRES_DB: grants-template
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data/
 
volumes:
  pgdata:
    driver: local